name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint_and_build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy .env.sample
        run: cp .env.sample .env
      - uses: pnpm/setup@v3
      - run: pnpm lint
      - run: pnpm build
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy .env.sample
        run: cp .env.sample .env
      - uses: pnpm/setup@v3
      - name: Download Pocketbase
        run: curl -L https://github.com/pocketbase/pocketbase/releases/download/v0.16.8/pocketbase_0.16.8_linux_amd64.zip -o pocketbase.zip
      - run: unzip pocketbase.zip
      - run: pnpm run pocketbase &
      - run: npx playwright install chromium --with-deps
      - run: pnpm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
